name: menage

# Supprime les sondes qui ne servent plus. Rien d'autre.
# data/ n'est jamais touche. Tout reste recuperable dans l'historique git.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ranger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: supprimer
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"

          git rm -f --ignore-unmatch \
            convertir.py \
            groupe.py \
            limite.py \
            sonde.py \
            sonde2.py \
            vieux.py \
            .github/workflows/groupe.yml \
            .github/workflows/limite.yml \
            .github/workflows/sonde.yml \
            .github/workflows/sonde2.yml

          echo "--- ce qui reste ---"
          git ls-files | grep -v '^data/'

          if git diff --staged --quiet; then
            echo "Rien a supprimer, le depot est deja propre."
            exit 0
          fi

          git commit -m "menage : on garde collect.py, index.html et loop.yml"
          git push
