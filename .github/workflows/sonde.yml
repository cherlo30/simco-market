name: sonde

# Mesure la limite du serveur du jeu, depuis la machine qui collecte.
# A lancer a la main, COLLECTEUR ARRETE : sinon les deux se partagent le
# meme quota et la mesure ne veut rien dire.

on:
  workflow_dispatch:
    inputs:
      repos:
        description: "silence entre deux experiences (secondes)"
        required: false
        default: "60"

concurrency:
  group: simco
  cancel-in-progress: false

jobs:
  mesurer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: sonder
        env:
          REPOS: ${{ github.event.inputs.repos || '60' }}
        run: python3 sonde.py
