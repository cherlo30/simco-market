name: collecte

on:
  workflow_dispatch:
    inputs:
      duree:
        description: "Duree de la collecte en minutes (3 pour tester la chaine)"
        required: false
        default: "330"
  schedule:
    - cron: "17 */3 * * *"      # filet de securite si la chaine se casse

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: horodater
        run: echo "DEBUT=$(date +%s)" >> $GITHUB_ENV

      - name: preparer git
        run: |
          git config user.name  "market-bot"
          git config user.email "market-bot@users.noreply.github.com"

      - name: collecter
        run: python3 collect.py
        env:
          DUREE_MIN: ${{ github.event.inputs.duree || '330' }}
          DELAY: "0.8"
          TICKER_SEC: "30"

      - name: synthese et purge
        if: always()
        run: python3 rollup.py

      - name: enregistrer
        if: always()
        run: |
          git add data
          git diff --staged --quiet && echo "rien de neuf" && exit 0
          git commit -m "collecte $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((RANDOM % 10 + 5))
          done
          exit 1

      # le temoin passe au coureur suivant.
      # GITHUB_TOKEN ne peut PAS declencher un workflow : il faut le jeton PAT.
      # Le suivant repart toujours sur la duree normale (330 min), meme si
      # celui-ci tournait en mode test.
      - name: relancer le suivant
        if: always()
        run: |
          ecoule=$(( $(date +%s) - DEBUT ))
          if [ "$ecoule" -lt 90 ]; then
            echo "La collecte n'a tenu que ${ecoule}s : c'est un plantage, pas une"
            echo "fin de course. On ne relance PAS, pour ne pas boucler a l'infini."
            exit 1
          fi
          echo "Collecte terminee apres ${ecoule}s. Passage du temoin."
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/loop.yml/dispatches \
            -d '{"ref":"${{ github.ref_name }}"}'
