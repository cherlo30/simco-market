name: collecte

# Le titre de CHAQUE execution dans la liste Actions. Le run precedent nous
# passe l'etiquette qu'il a calculee : la page devient lisible sans ouvrir
# un seul run. Les declenchements manuels ou par cron n'en ont pas, ils
# gardent un titre neutre.
run-name: ${{ inputs.etiquette || 'collecte (depart)' }}

on:
  workflow_dispatch:
    inputs:
      lot:
        description: "Nombre de carnets lus par run (9 par defaut, 1 pour tester)"
        required: false
        default: "9"
      etiquette:
        description: "Titre du run (rempli automatiquement par le run precedent)"
        required: false
        default: ""
  schedule:
    - cron: "17 */3 * * *"      # filet de securite si la chaine se casse

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    # Un run lit LOT carnets a 10 requetes/minute : deux minutes suffisent.
    # Le timeout n'est plus la duree voulue, c'est le disjoncteur.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: horodater
        run: echo "DEBUT=$(date +%s)" >> $GITHUB_ENV

      - name: preparer git
        run: |
          git config user.name  "market-bot"
          git config user.email "market-bot@users.noreply.github.com"

      # collect.py enregistre lui-meme : le carnet ET le curseur sur la
      # branche live, les heures terminees sur la branche principale.
      - name: collecter
        run: python3 collect.py
        env:
          # LE bouton, et il a une bonne valeur : LOT + 1 releve de prix
          # doit tenir dans QUOTA. A 9 le run n'attend jamais (~15 s) ;
          # a 10 il attend 55 s pour une seule lecture de plus. Le cycle
          # complet ne va pas plus vite pour autant — il est borne a
          # 142/10 = 14,2 min par le serveur — mais il coute deux fois
          # moins de minutes GitHub.
          # Si des refus apparaissent, descendre a 8 avant tout le reste.
          LOT: ${{ github.event.inputs.lot || '9' }}
          # MESURE sur le runner : le serveur accorde 10 lectures par
          # minute, pas une de plus. On ne cherche donc plus a ruser — on
          # vit dans la limite, ce qui rend les refus impossibles.
          QUOTA: "10"         # lectures autorisees...
          FENETRE: "60"       # ...par tranche de X secondes
          QUOTA_MIN: "5"      # plancher si le serveur se resserre
          MARGE: "0.3"        # coussin de securite, en secondes
          # market-ticker rend les 142 prix en UNE requete : un releve au
          # debut du run, et un a la fin UNIQUEMENT s'il est gratuit
          # (run long ET place libre dans la fenetre).
          TICKER_SEC: "60"
          # Un releve de prix un run sur deux : la place liberee va a un
          # carnet de plus. Mettre 1 pour un releve a chaque run, 4 pour un
          # releve par minute environ.
          TICKER_RUNS: "2"
          # --- allocation de l'attention -------------------------------
          # On lit en priorite la ou il se passe des choses. PLANCHER est le
          # bouton de concentration : plus il est bas, plus le budget va aux
          # produits actifs. Mesure sur 4 h simulees avec tes vraies
          # activites (lectures/heure du plus actif vs d'un produit mort,
          # et pire attente observee) :
          #   0.30 -> 25 vs 13   · pire attente  5 min  (presque uniforme)
          #   0.05 -> 58 vs 10   · pire attente  6 min  (defaut)
          #   0.01 -> 113 vs 5   · pire attente 13 min
          #   0.002-> 120 vs 2   · pire attente 30 min  (bute sur AGE_MAX)
          PLANCHER: "0.05"
          # LES DEUX ECHEANCES. Ce ne sont pas des souhaits mais des
          # CHARGES : exiger une lecture toutes les T min pour N produits
          # coute N/T lectures par minute. Capacite mesuree : 32,6/min.
          #   AGE_BOUGE 3 + AGE_MAX 5 -> 36,0/min : NE TIENT PAS
          #   AGE_BOUGE 3 + AGE_MAX 7 -> 31,1/min : tient
          #   AGE_BOUGE 4 + AGE_MAX 5 -> 31,2/min : tient (retenu)
          # collect.py refait ce calcul a chaque run et previent s'il ne
          # tient plus.
          AGE_BOUGE_MIN: "4"
          # MESURE : 76 % du volume s'echange hors qualite 0, sur 7,8
          # qualites actives par produit. Le ticker ne rend qu'un prix par
          # produit : il est aveugle aux trois quarts de l'activite. Le
          # balayage regulier n'est donc pas un filet de securite, c'est le
          # principal moyen de voir le marche.
          #
          # LE PLAFOND EST LE VRAI BOUTON DE CONCENTRATION. Il consomme
          # 142/AGE_MAX lectures par minute avant meme qu'on ait priorise
          # quoi que ce soit ; ce qui reste va aux produits actifs. Mesure
          # sur 2 h simulees, 10 ressources tres actives contre 132 calmes :
          #
          #   AGE_MAX  age max  ratio actif/calme  lect/h actif  lect/h calme
          #     5 min    4,5m         1,8x              25            13
          #     6 min    5,6m         5,0x              55            11
          #     7 min    6,7m         7,9x              76            10
          #     8 min    7,5m        10,2x              88             9
          #    10 min    9,6m        15,4x             109             7
          #
          # A 5 min la capacite est saturee : il ne reste presque rien pour
          # prioriser. Une minute de plus TRIPLE l'attention portee aux
          # produits actifs (25 -> 55 lectures/heure) et ne coute que deux
          # lectures par heure aux calmes. Aucun produit n'est jamais oublie
          # dans aucun de ces reglages.
          AGE_MAX_MIN: "5"
          # Le prix a change depuis notre derniere lecture : on double le
          # score. Le ticker coute une requete et oriente les neuf autres.
          BONUS_TICKER: "2"
          # Poids du dernier releve dans la moyenne mobile du debit.
          MEMOIRE: "0.3"
          # Plafond de securite : un run qui depasse ca s'arrete de lui-meme
          # et passe quand meme le temoin. Ce n'est pas la duree normale.
          DUREE_MIN: "10"

      - name: filet de securite
        if: always()
        run: |
          git add data
          git diff --staged --quiet && echo "rien de neuf" && exit 0
          git commit -m "fin de course $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((RANDOM % 10 + 5))
          done
          exit 1

      # le temoin passe au coureur suivant.
      # GITHUB_TOKEN ne peut PAS declencher un workflow : il faut le jeton PAT.
      - name: relancer le suivant
        if: always()
        env:
          PAT_BRUT: ${{ secrets.PAT }}
          # secondes d'attente avant de passer le temoin. 0 = a fond.
          PAUSE_AVANT: "0"
        run: |
          # Avant, on jugeait un run a sa DUREE : moins de 90 s = plantage.
          # Avec des runs d'une minute, ce critere ne veut plus rien dire.
          # collect.py ecrit maintenant un fichier temoin en toute derniere
          # ligne : sa presence prouve que le run est alle au bout, quelle
          # que soit sa duree. Son absence prouve qu'il est mort en route.
          if [ ! -f collecte_ok ]; then
            echo "Pas de temoin 'collecte_ok' : le run est mort avant la fin."
            echo "On ne relance PAS, pour ne pas boucler a l'infini sur un"
            echo "plantage. Le cron de secours reprendra la chaine."
            exit 1
          fi
          ecoule=$(( $(date +%s) - DEBUT ))
          GH_TOKEN="$(printf %s "$PAT_BRUT" | tr -d '[:space:]')"
          export GH_TOKEN
          if [ -z "$GH_TOKEN" ]; then
            echo "Le secret PAT est vide ou absent : impossible de passer le temoin."
            exit 1
          fi
          # collect.py a ecrit le titre du prochain run : on le lui donne,
          # il s'affichera dans la liste des executions a la place du
          # "collecte n123" par defaut.
          ETIQ="$(head -c 200 prochain.txt 2>/dev/null | tr -d '\n')"
          [ -z "$ETIQ" ] && ETIQ="collecte"
          # ATTENTION, lire le commentaire en tete de collect.py : le quota
          # de 10 requetes/minute est compte PAR PROCESSUS. Chaque run
          # repart d'une fenetre vierge, donc la chaine envoie en realite
          # 10 requetes toutes les ~15 s, soit ~40 par minute. PAUSE_AVANT
          # espace les runs pour ramener le debit reel a la valeur voulue :
          #   0  -> aucune retenue (debit ~40/min)
          #   45 -> un run par minute environ (debit ~10/min)
          if [ "${PAUSE_AVANT:-0}" -gt 0 ]; then
            echo "Pause de ${PAUSE_AVANT}s pour tenir le debit voulu."
            sleep "${PAUSE_AVANT}"
          fi
          echo "Lot collecte en ${ecoule}s. Passage du temoin : $ETIQ"
          gh workflow run loop.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" \
             -f lot="${{ github.event.inputs.lot || '9' }}" \
             -f etiquette="$ETIQ"
          echo "Temoin passe."
