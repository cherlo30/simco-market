name: collecte

on:
  workflow_dispatch:
    inputs:
      duree:
        description: "Duree de la collecte en minutes (3 pour tester la chaine)"
        required: false
        default: "330"
  schedule:
    - cron: "17 */3 * * *"      # filet de securite si la chaine se casse

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: horodater
        run: echo "DEBUT=$(date +%s)" >> $GITHUB_ENV

      - name: preparer git
        run: |
          git config user.name  "market-bot"
          git config user.email "market-bot@users.noreply.github.com"

      # collect.py enregistre lui-meme : le carnet sur la branche live a
      # chaque envoi, les heures terminees sur la branche principale.
      - name: collecter
        run: python3 collect.py
        env:
          DUREE_MIN: ${{ github.event.inputs.duree || '330' }}
          # MESURE sur le runner : le serveur accorde 10 lectures par
          # minute, pas une de plus. On ne cherche donc plus a ruser — on
          # vit dans la limite, ce qui rend les refus impossibles.
          QUOTA: "10"         # lectures autorisees...
          FENETRE: "60"       # ...par tranche de X secondes
          QUOTA_MIN: "5"      # plancher si le serveur se resserre
          MARGE: "0.3"        # coussin de securite, en secondes
          # market-ticker rend les 142 prix en UNE requete : un dixieme du
          # budget tient donc TOUS les prix a jour a la minute, et les neuf
          # autres vont aux carnets detailles (qualite, profondeur, volumes).
          TICKER_SEC: "60"
          LIVE_SEC: "300"

      - name: filet de securite
        if: always()
        run: |
          git add data
          git diff --staged --quiet && echo "rien de neuf" && exit 0
          git commit -m "fin de course $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((RANDOM % 10 + 5))
          done
          exit 1

      # le temoin passe au coureur suivant.
      # GITHUB_TOKEN ne peut PAS declencher un workflow : il faut le jeton PAT.
      - name: relancer le suivant
        if: always()
        env:
          PAT_BRUT: ${{ secrets.PAT }}
        run: |
          ecoule=$(( $(date +%s) - DEBUT ))
          if [ "$ecoule" -lt 90 ]; then
            echo "La collecte n'a tenu que ${ecoule}s : c'est un plantage, pas une"
            echo "fin de course. On ne relance PAS, pour ne pas boucler a l'infini."
            exit 1
          fi
          GH_TOKEN="$(printf %s "$PAT_BRUT" | tr -d '[:space:]')"
          export GH_TOKEN
          if [ -z "$GH_TOKEN" ]; then
            echo "Le secret PAT est vide ou absent : impossible de passer le temoin."
            exit 1
          fi
          echo "Collecte terminee apres ${ecoule}s. Passage du temoin."
          gh workflow run loop.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
          echo "Temoin passe."
