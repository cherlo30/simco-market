name: ticker

on:
  schedule:
        - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

concurrency:
  group: ticker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 collect_ticker.py
      - name: commit
        run: |
          git config user.name  "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet && echo "rien de neuf" && exit 0
          git commit -m "ticker $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((RANDOM % 10 + 5))
          done
          exit 1
